name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.3.0, v2.3.1)'
        required: false
        default: 'v2.3.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TradeMind Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild Android Native Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure Custom Splash Screen & Brand Theme
        working-directory: ./mobile
        run: |
          # Override white splash screen background with sleek TradeMind dark theme (#070b14)
          if [ -f "android/app/src/main/res/values/colors.xml" ]; then
            sed -i 's/<color name="splashscreen_background">#FFFFFF<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
            sed -i 's/<color name="splashscreen_background">.*<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
          fi
          # Replace default expo wireframe oval logo with official TradeMind high-res logo
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi drawable; do
            if [ -d "android/app/src/main/res/$d" ]; then
              cp -f assets/splash.png android/app/src/main/res/$d/splashscreen_logo.png || true
            fi
          done

      - name: Generate Official TradeMind Release Keystore
        working-directory: ./mobile/android/app
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TradeMind AI, OU=TradeMind, O=TradeMind Technologies, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Make Gradlew Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Compile Production Release APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify Bundle and Prepare Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/TradeMind.apk
          
          echo "Verifying index.android.bundle inside APK:"
          unzip -l build-output/TradeMind.apk | grep -i "index.android.bundle"
          
          ls -lh build-output/TradeMind.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-APK
          path: build-output/TradeMind.apk

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="v2.3.0"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: TradeMind Android APK ${{ steps.vars.outputs.TAG_NAME }} (Production Release)
          body: |
            ### 📱 TradeMind Production Release APK (${{ steps.vars.outputs.TAG_NAME }})
            Official Android Release created & architected by **Abhishek**.
            
            **✨ Release v2.3.0 Highlights & Enhancements:**
            - 🔑 **Forgot Password Recovery System**: Instantly reset your password securely with account email verification and resume journaling without data loss.
            - ✉️ **Streamlined Email Authentication**: Clean, fast Email & Password auth flow (Mobile OTP option removed per user preference).
            - 🔄 **Smart In-App Update Engine**: Now checks installed vs latest release version — if you are already on the current version, it confirms "App is already updated" and disables redundant downloads.
            - ⚡ **Direct Broker Integration (Delta Exchange, Exness, Binance, Zerodha)**: Connect your broker accounts to directly sync executed trades, positions, and fees without manual entry.
            - 🤖 **TradeMind AI Performance Analyst**: AI-powered trade diagnostics that analyze synced broker executions and deliver actionable recommendations for risk control, fee optimization, emotional discipline, and strategy improvement.
            - 🛡️ **Permanent Multi-Tier Data Vault**: Automatic device scavenger and FileSystem mirror ensuring your accounts and trade history remain 100% safe across updates.
            - 📦 **In-App Background APK Installer**: Download and install updates directly inside the app with a live progress bar.
            
            **📲 Installation:**
            1. Download `TradeMind.apk` below directly to your smartphone.
            2. Tap to install and run!
          files: build-output/TradeMind.apk
