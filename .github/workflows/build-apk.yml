name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.2.0, v2.2.1)'
        required: false
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TradeMind Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild Android Native Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure Custom Splash Screen & Brand Theme
        working-directory: ./mobile
        run: |
          # Override white splash screen background with sleek TradeMind dark theme (#070b14)
          if [ -f "android/app/src/main/res/values/colors.xml" ]; then
            sed -i 's/<color name="splashscreen_background">#FFFFFF<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
            sed -i 's/<color name="splashscreen_background">.*<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
          fi
          # Replace default expo wireframe oval logo with official TradeMind high-res logo
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi drawable; do
            if [ -d "android/app/src/main/res/$d" ]; then
              cp -f assets/splash.png android/app/src/main/res/$d/splashscreen_logo.png || true
            fi
          done

      - name: Generate Official TradeMind Release Keystore
        working-directory: ./mobile/android/app
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v -storetype PKCS12 \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=TradeMind AI, OU=TradeMind, O=TradeMind Technologies, L=Mumbai, ST=Maharashtra, C=IN"

      - name: Make Gradlew Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Compile Production Release APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify Bundle and Prepare Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/TradeMind.apk
          
          echo "Verifying index.android.bundle inside APK:"
          unzip -l build-output/TradeMind.apk | grep -i "index.android.bundle"
          
          ls -lh build-output/TradeMind.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-APK
          path: build-output/TradeMind.apk

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="v2.2.0"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: TradeMind Android APK ${{ steps.vars.outputs.TAG_NAME }} (Production Release)
          body: |
            ### 📱 TradeMind Production Release APK (${{ steps.vars.outputs.TAG_NAME }})
            Official Android Release created & architected by **Abhishek**.
            
            **✨ Release v2.2.0 Highlights & Enhancements:**
            - 🛡️ **Permanent Multi-Tier Data Vault (Zero Data Loss)**: Universal storage scavenger automatically detects, recovers, and restores all past user accounts, email logins, and trading records from all previous app versions (`v2.0.0`, `v2.1.0`, `v1.0`). Your journal is never erased across updates or reloads.
            - 📦 **In-App APK Downloader & Installer**: When clicking "Check for Updates", you can now download the latest TradeMind update package directly inside the app with a real-time progress bar and install it immediately without leaving the app!
            - 💬 **Real System Message Notification for OTP**: 4-digit verification code now arrives as an Android system notification message banner right in your status bar / notification shade with sound, plus a 1-tap Auto-Fill button.
            - 🔍 **Deep Scan & Restore Past Data Tool**: Dedicated recovery button in Account & Data Vault tab that can re-scan device storage anytime and rescue any orphaned trades.
            - 📤 **Export Journal Backup (.json)**: Export full encrypted trading journal with 1 tap to Google Drive, WhatsApp, Downloads, or Files for complete peace of mind.
            - 🚀 **Dark Native Boot Window**: Clean `#070b14` dark theme splash with high-resolution TradeMind AI Neural Logo.
            - 🔙 **Smart Hardware Back Navigation**: Smooth modal dismissal, 1-tap return to Dashboard, and confirmed exit.
            - 🖼️ **Trade Chart Photo Attachment**: Camera roll picker for charts with zoomable full-screen viewer.
            
            **📲 Installation:**
            1. Download `TradeMind.apk` below directly to your smartphone.
            2. Tap to install and run!
          files: build-output/TradeMind.apk
