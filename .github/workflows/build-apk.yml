name: Build Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v2.3.0, v2.3.1)'
        required: false
        default: 'v2.3.2'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TradeMind Production APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild Android Native Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Configure Custom Splash Screen & Brand Theme
        working-directory: ./mobile
        run: |
          # Override white splash screen background with sleek TradeMind dark theme (#070b14)
          if [ -f "android/app/src/main/res/values/colors.xml" ]; then
            sed -i 's/<color name="splashscreen_background">#FFFFFF<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
            sed -i 's/<color name="splashscreen_background">.*<\/color>/<color name="splashscreen_background">#070b14<\/color>/g' android/app/src/main/res/values/colors.xml || true
          fi
          # Replace default expo wireframe oval logo with official TradeMind high-res logo
          for d in drawable-mdpi drawable-hdpi drawable-xhdpi drawable-xxhdpi drawable-xxxhdpi drawable; do
            if [ -d "android/app/src/main/res/$d" ]; then
              cp -f assets/splash.png android/app/src/main/res/$d/splashscreen_logo.png || true
            fi
          done

      - name: Configure Official TradeMind Release Keystore
        working-directory: ./mobile
        run: |
          if [ -f "keystore/trademind.keystore" ]; then
            echo "Using persistent official TradeMind release keystore."
            cp -f keystore/trademind.keystore android/app/debug.keystore
          else
            echo "Generating fallback keystore..."
            cd android/app
            keytool -genkeypair -v -storetype PKCS12 \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=TradeMind AI, OU=TradeMind, O=TradeMind Technologies, L=Mumbai, ST=Maharashtra, C=IN"
          fi

      - name: Make Gradlew Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Compile Production Release APK
        working-directory: ./mobile/android
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon

      - name: Verify Bundle and Prepare Output
        run: |
          mkdir -p build-output
          APK_PATH=$(find mobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" build-output/TradeMind.apk
          
          echo "Verifying index.android.bundle inside APK:"
          unzip -l build-output/TradeMind.apk | grep -i "index.android.bundle"
          
          ls -lh build-output/TradeMind.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-APK
          path: build-output/TradeMind.apk

      - name: Determine Version Tag
        id: vars
        run: |
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then
            TAG="v2.3.2"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_OUTPUT

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.vars.outputs.TAG_NAME }}
          name: TradeMind Android APK ${{ steps.vars.outputs.TAG_NAME }} (Production Release)
          body: |
            ### 📱 TradeMind Production Release APK (${{ steps.vars.outputs.TAG_NAME }})
            Official Android Release created & architected by **Abhishek**.
            
            **✨ Release v2.3.2 Production Release & Broker Integration:**
            - ⚡ **Real Delta Exchange REST API Sync**: Direct HMAC-SHA256 authenticated sync from Delta Exchange (India & Global). Live ingestion of real filled and closed orders with accurate execution prices, commission fees, and realized P&L.
            - 🌐 **Real Exness MT5 Statement & Trade Ingestion**: Seamless parser for Exness MetaTrader 5 trade reports and closed position lines. Zero fake or demo trades in your personal journal.
            - 🛡️ **Purged Fake & Demo Brokers**: All mock trades and pre-connected fake brokers removed from private user accounts. Only your real trading data is tracked.
            - 🔄 **In-App Updater Enhancements**: Fixed package installer launch flags (`FLAG_ACTIVITY_NEW_TASK` + `FLAG_GRANT_READ_URI_PERMISSION`) and added system installer fallback. Removed redundant re-download button when the app is already up to date.
            - 🔑 **Auth Screen Password Recovery**: One-tap password reset directly on the login screen with email verification.
            - 📱 **Universal Dual-Architecture Build**: Full native support for `arm64-v8a` and `armeabi-v7a` chipsets.
            - 🔐 **Permanent Keystore**: 100% data safety across all future updates.
            
            **📲 Installation:**
            1. Download `TradeMind.apk` below directly to your smartphone.
            2. Tap to install and run!
          files: build-output/TradeMind.apk
