name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build TradeMind APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Mobile Dependencies
        working-directory: ./mobile
        run: npm install

      - name: Prebuild Android Native Project
        working-directory: ./mobile
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradlew Executable
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Output
        run: |
          mkdir -p build-output
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk build-output/TradeMind.apk
          echo "TradeMind.apk ready."

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradeMind-APK
          path: build-output/TradeMind.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: TradeMind Android APK v1.0.0
          body: |
            ### 📱 TradeMind Android APK
            Standalone Android application package for TradeMind.
            
            **Installation Instructions:**
            1. Download `TradeMind.apk` below directly to your Android device.
            2. Tap the downloaded file to install.
            3. If prompted, allow "Install from unknown sources".
            4. Open TradeMind and start journaling!
          files: build-output/TradeMind.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
